function courseEntries(){return [...IR.map(v=>({key:idV(v,'ir'),en:v.base,fr:v.fr,detail:v.base+' · '+v.past+' · '+v.part,kind:'verbe irrégulier',past:v.past,part:v.part})),...REG.map(v=>({key:idV(v,'reg'),en:v.base,fr:v.fr,detail:v.base+' → '+v.past,kind:'verbe régulier',past:v.past})),...WORDS.map((w,i)=>({key:'word:'+i,en:w.en,fr:w.fr,kind:'mot · '+w.topic,detail:w.en}))]}
const ALL=courseEntries();
function pickLearn(){let pool=ALL.filter(x=>state.hard[x.key]);if(pool.length&&Math.random()<.6)return rand(pool);let unseen=ALL.filter(x=>!state.seen[x.key]);return unseen.length?rand(unseen):rand(ALL)}
function learn(){if(!active||active.mode!=='learn')active={mode:'learn',entry:pickLearn(),revealed:false,count:0};return learnView()}

function learnReveal(){active.revealed=true;$('view').innerHTML=learnView()}
function learnRate(ok){let k=active.entry.key;state.seen[k]=ok?(state.seen[k]||0)+1:0;state.hard[k]=!ok;persist();active.entry=pickLearn();active.revealed=false;active.count++;$('view').innerHTML=learnView()}
function verbs(){let t=active?.mode==='verbs'?active:{mode:'verbs',tab:'ir',filter:''};active=t;let irregular=t.tab==='ir',list=(irregular?IR:REG).filter(v=>(v.base+' '+v.fr).toLowerCase().includes((t.filter||'').toLowerCase()));return `<section class="card"><div class="tagline">Fiches + lecture audio</div><h2>📚 Mes verbes</h2><p class="muted">Base verbale, prétérit et participe passé pour les irréguliers. Pour les réguliers : la terminaison -ed.</p><div class="buttons">${btn('Irréguliers ('+IR.length+')',"verbMode('ir')",irregular?'yellow':'pale')}${btn('Réguliers ('+REG.length+')',"verbMode('reg')",!irregular?'yellow':'pale')}</div><p><input class="input" placeholder="Chercher un verbe…" aria-label="Chercher un verbe" value="${escapeHTML(t.filter)}" oninput="verbFilter(this.value)"></p><div id="verblist">${verbList(list,irregular)}</div></section>`}
function verbList(list,irregular){return list.map(v=>`<div class="lesson"><div><div class="en">${escapeHTML(v.base)}</div><div>${escapeHTML(v.fr)}</div><small>${irregular?`Past: <b>${escapeHTML(v.past)}</b> · Participle: <b>${escapeHTML(v.part)}</b>`:`Past: <b>${escapeHTML(v.past)}</b>`}</small></div><button class="btn pale" aria-label="Prononcer ${escapeHTML(v.base)}" onclick='speak(${JSON.stringify(v.base+", "+v.past+(irregular?", "+v.part:''))})'>🔊</button></div>`).join('')||'<p>Aucun résultat.</p>'}
function verbMode(x){active={mode:'verbs',tab:x,filter:''};$('view').innerHTML=verbs()}
function verbFilter(s){active.filter=s;$('verblist').innerHTML=verbList((active.tab==='ir'?IR:REG).filter(v=>(v.base+' '+v.fr).toLowerCase().includes(s.toLowerCase())),active.tab==='ir')}
function words(){let t=active?.mode==='words'?active:{mode:'words',topic:'tous',filter:''};active=t;let topics=['tous',...new Set(WORDS.map(w=>w.topic))],list=WORDS.filter(w=>(t.topic==='tous'||w.topic===t.topic)&&(w.en+' '+w.fr).toLowerCase().includes(t.filter.toLowerCase()));return `<section class="card"><div class="tagline">Plus de ${WORDS.length} mots de la vraie vie</div><h2>💬 Mes mots du quotidien</h2><p><select aria-label="Catégorie" onchange="wordTopic(this.value)">${topics.map(k=>`<option ${k===t.topic?'selected':''} value="${escapeHTML(k)}">${escapeHTML(k)}</option>`).join('')}</select></p><p><input class="input" aria-label="Chercher un mot" placeholder="Chercher un mot…" oninput="wordFilter(this.value)" value="${escapeHTML(t.filter)}"></p><div id="wordlist">${wordList(list)}</div></section>`}
function wordList(list){return list.map(w=>`<div class="lesson"><div><div class="en">${escapeHTML(w.en)}</div><div>${escapeHTML(w.fr)}</div><small>${escapeHTML(w.topic)}</small></div><button class="btn pale" onclick='speak(${JSON.stringify(w.en)})'>🔊</button></div>`).join('')||'<p>Aucun résultat.</p>'}
function wordTopic(s){active.topic=s;$('view').innerHTML=words()}
function wordFilter(s){active.filter=s;$('wordlist').innerHTML=wordList(WORDS.filter(w=>(active.topic==='tous'||w.topic===active.topic)&&(w.en+' '+w.fr).toLowerCase().includes(s.toLowerCase())))}

function phrases(){let t=active?.mode==='phrases'?active:{mode:'phrases',topic:'tous'};active=t;let topics=['tous',...new Set(PHRASES.map(p=>p.topic))];let list=PHRASES.filter(x=>t.topic==='tous'||t.topic===x.topic);return `<section class="card"><div class="tagline">Parler en anglais dans la vraie vie</div><h2>🗣️ 35 phrases utiles</h2><p class="muted">Écoute d’abord l’anglais, puis lis le sens. Répète à voix haute si tu peux.</p><p><select onchange="phraseTopic(this.value)">${topics.map(x=>`<option value="${escapeHTML(x)}" ${x===t.topic?'selected':''}>${escapeHTML(x)}</option>`).join('')}</select></p>${list.map(x=>`<div class="lesson"><div style="flex:1"><div class="en" style="font-size:17px">${escapeHTML(x.en)}</div><div>${escapeHTML(x.fr)}</div><small>${escapeHTML(x.topic)}</small></div>${audioBtn(x.en)}</div>`).join('')}</section>`}
function phraseTopic(topic){active.topic=topic;$('view').innerHTML=phrases()}
function grammar(){let lessons=[['Present Simple','I play volleyball. / She plays volleyball.','Habitudes et faits. À la 3e personne (he/she/it), on ajoute souvent -s ou -es.','I do not play. / Does she play?'],['Present Continuous','I am playing volleyball now.','Action qui se déroule maintenant : am/is/are + verbe-ing.','She is training at the moment.'],['Past Simple','I played yesterday. / I went home.','Action passée terminée. Verbes réguliers : -ed. Irréguliers : forme spéciale (go → went).','Did you go? / I did not go.'],['Future','I will study tonight.','Pour annoncer une décision ou une prévision : will + base verbale. Pour un projet : be going to.','I am going to play tomorrow.'],['Present Perfect','I have finished. / She has eaten.','have/has + participe passé. On parle d’une expérience ou d’un résultat lié au présent.','I have never been there.'],['Questions & négation','Do you like English? / Did you play?','Present Simple : do/does. Past Simple : did + verbe de base.','She does not play. / Did she win?']];return `<section class="card"><div class="tagline">Repères de niveau 5e</div><h2>📘 Mini-leçons de grammaire</h2><p class="muted">Des explications courtes avec des exemples que tu peux écouter. Les verbes irréguliers ont leurs trois formes dans l’onglet « Les verbes ».</p>${lessons.map((a,i)=>`<div class="lesson" style="align-items:flex-start"><div style="flex:1"><div class="en">${i+1}. ${escapeHTML(a[0])}</div><p style="font-size:17px;font-weight:800">${escapeHTML(a[1])}</p><p class="muted">${escapeHTML(a[2])}</p><p class="muted">Ex. ${escapeHTML(a[3])}</p>${audioBtn(a[1])}</div></div>`).join('')}</section>`}

function qBank(d=1){let base=IR.slice(0,Math.min(IR.length,16+d*3)).map(v=>({en:v.base,fr:v.fr})),common=WORDS.slice(0,Math.min(WORDS.length,25+d*6)).map(w=>({en:w.en,fr:w.fr})),reg=REG.slice(0,Math.min(REG.length,8+d*3)).map(v=>({en:v.base,fr:v.fr}));return [...base,...common,...reg]}
function newChoice(mode='quiz',d=2){let a=sample(qBank(d),Math.min(qBank(d).length,30));let entry=rand(a),reverse=Math.random()<.5,correct=reverse?entry.en:entry.fr;let others=shuffle([...new Set(a.map(v=>reverse?v.en:v.fr).filter(v=>v!==correct))]).slice(0,3);return {mode,entry,reverse,correct,options:shuffle([correct,...others]),picked:null,feedback:null,d,answered:false}}

function chooseAnswer(i){if(active.answered)return;active.picked=active.options[i];active.answered=true;state.stats.total++;if(active.picked===active.correct)state.stats.correct++;persist();$('view').innerHTML=choiceView('🎯 Traductions', 'Parfois anglais → français, parfois français → anglais.')}

function conjugationBank(d=3){let arr=IR.slice(0,Math.min(IR.length,14+d*4)).map(v=>({base:v.base,past:v.past,fr:v.fr,ir:true,part:v.part}));arr.push(...REG.slice(0,Math.min(REG.length,8+d*3)).map(v=>({base:v.base,past:v.past,fr:v.fr,ir:false})));return arr}
function newConj(mode='conj',d=3){let v=rand(conjugationBank(d)),task=rand(d<3?['past','present']:['past','present','part']),part=task==='part'&&!v.part?'past':task;let prompt=part==='past'?`Yesterday, I ___ (${v.base}).`:part==='present'?`Every day, she ___ (${v.base}).`:`I have ___ (${v.base}).`;let correct=part==='past'?(v.base==='be'?'was':v.past):part==='part'?v.part: (v.base==='be'?'is':v.base==='have'?'has':v.base==='do'?'does':v.base==='go'?'goes':v.base.endsWith('y')&&!/[aeiou]y$/.test(v.base)?v.base.slice(0,-1)+'ies':/(s|x|ch|sh|o)$/.test(v.base)?v.base+'es':v.base+'s');return {mode,v,task:part,prompt,correct,done:false,input:'',d}}
function conj(){if(!active||active.mode!=='conj')active=newConj('conj',3);return conjView()}
function conjView(){let a=active;return `<section class="card"><div class="tagline">Conjugaison · Past Simple / Present Simple / Present Perfect</div><h2>✍️ Je conjugue</h2><div class="prompt"><div class="sentence">${escapeHTML(a.prompt)}</div><div class="qsub">${escapeHTML(a.v.fr)} · ${a.task==='past'?'Prétérit':a.task==='present'?'Présent avec she':'Participe passé'}</div></div>${a.done?`<div class="feedback ${normalize(a.input)===normalize(a.correct)?'good':'bad'}">${normalize(a.input)===normalize(a.correct)?'✅ Bonne réponse !':'❌ Bonne réponse : '+escapeHTML(a.correct)}</div>${audioBtn(a.prompt.replace('___',a.correct))}<div class="buttons">${btn('Verbe suivant ➜','nextConj()','yellow')}</div>`:`<input id="conjinput" class="input" placeholder="Écris la forme du verbe" aria-label="Réponse en anglais" autocapitalize="off" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkConj()"><div class="buttons">${btn('Vérifier ✓','checkConj()','yellow')}${btn('🔊 Verbe',`speak(${JSON.stringify(a.v.base)})`,'pale')}</div>`}</section>`}
function checkConj(){if(active.done)return;active.input=$('conjinput').value.trim();if(!active.input){toast('Écris une réponse');return}active.done=true;state.stats.total++;if(normalize(active.input)===normalize(active.correct))state.stats.correct++;persist();$('view').innerHTML=conjView()}

function makePairs(mode='pairs',d=3){let entries=sample(qBank(d),d>4?6:5);return {mode,entries,tiles:shuffle(entries.flatMap((e,i)=>[{id:i+'e',value:e.en,group:i,lang:'en'},{id:i+'f',value:e.fr,group:i,lang:'fr'}])),selected:null,matched:[],mistakes:0,done:false}}
function pairs(){if(!active||active.mode!=='pairs')active=makePairs();return pairsView()}
function pairsView(){let a=active;return `<section class="card"><h2>🔗 Relie les mots</h2><p class="muted">Associe chaque mot anglais à sa traduction française. Aucun indice de couleur !</p><div class="progress-head"><strong>${a.matched.length/2} / ${a.entries.length} paires</strong><span>${a.mistakes} erreur(s)</span></div><div class="pairgrid">${a.tiles.map((t,i)=>`<button ${a.matched.includes(t.id)?'disabled':''} class="pair ${a.matched.includes(t.id)?'matched':''} ${a.selected===t.id?'active':''}" onclick="pairPick(${i})">${escapeHTML(t.value)}</button>`).join('')}</div>${a.done?`<div class="feedback good">🏆 Bravo, toutes les paires sont trouvées !</div>${btn('Rejouer','restartPairs()','yellow')}`:''}</section>`}
function pairPick(i){let a=active;if(lock||a.done)return;let t=a.tiles[i];if(a.matched.includes(t.id))return;if(a.selected===null){a.selected=t.id;$('view').innerHTML=pairsView();return}let first=a.tiles.find(x=>x.id===a.selected);a.selected=null;if(first.group===t.group&&first.lang!==t.lang){a.matched.push(first.id,t.id);if(a.matched.length===a.tiles.length){a.done=true;state.stats.correct+=a.entries.length;state.stats.total+=a.entries.length;persist()}}else{a.mistakes++;toast('Essaie une autre paire')}$('view').innerHTML=pairsView()}

function makeMemory(d=3){let entries=sample(qBank(d),d>4?6:4),tiles=shuffle(entries.flatMap((e,i)=>[{id:i+'e',value:e.en,group:i,lang:'en'},{id:i+'f',value:e.fr,group:i,lang:'fr'}]));return {mode:'memory',entries,tiles,up:[],matched:[],tries:0,done:false}}

function memoryPick(i){let a=active;if(lock||a.done)return;let t=a.tiles[i];if(a.matched.includes(t.id)||a.up.includes(t.id)||a.up.length>=2)return;a.up.push(t.id);$('view').innerHTML=memoryView();if(a.up.length===2){a.tries++;let [x,y]=a.up.map(id=>a.tiles.find(t=>t.id===id));if(x.group===y.group&&x.lang!==y.lang){lock=true;setTimeout(()=>{a.matched.push(x.id,y.id);a.up=[];lock=false;if(a.matched.length===a.tiles.length){a.done=true;state.stats.total+=a.entries.length;state.stats.correct+=a.entries.length;persist()}if(state.tab==='memory')$('view').innerHTML=memoryView()},450)}else{lock=true;setTimeout(()=>{a.up=[];lock=false;if(state.tab==='memory')$('view').innerHTML=memoryView()},950)}}}

function fallPool(){let p=shuffle([...WORDS.map(w=>({en:w.en,fr:w.fr})),...IR.slice(0,35).map(v=>({en:v.base,fr:v.fr})),...REG.slice(0,20).map(v=>({en:v.base,fr:v.fr}))]);let usedE=new Set(),usedF=new Set();return p.filter(e=>{let a=e.en.toLowerCase(),b=e.fr.toLowerCase();if(usedE.has(a)||usedF.has(b))return false;usedE.add(a);usedF.add(b);return true}).slice(0,65)}
function separateTiles(tiles){for(let k=0;k<400;k++){let test=shuffle(tiles);let good=test.every((t,i)=>test.every((q,j)=>q.group!==t.group||i===j||Math.abs(j-i)>2));if(good)return test}return shuffle(tiles)}
function startFall(){stopTimers();let pool=fallPool();let entries=sample(pool,5);active={mode:'fall',pool:pool.filter(x=>!entries.some(y=>y.en===x.en&&y.fr===x.fr)),queue:[],tiles:separateTiles(entries.flatMap((e,i)=>[{id:i+'-en',group:i,lang:'en',value:e.en},{id:i+'-fr',group:i,lang:'fr',value:e.fr}])),nextID:5,selected:null,score:0,mistakes:0,time:30,finished:false,result:''};fallTimer=setInterval(()=>{if(!active||active.mode!=='fall'){clearInterval(fallTimer);return}active.time--;if(active.time<=0){active.time=30;fallDrop();}if($('fallclock'))$('fallclock').textContent=active.time},1000)}
function fallDrop(){let a=active;if(a.finished)return;if(a.tiles.length>=24){a.finished=true;a.result='La pile est pleine !';clearInterval(fallTimer);$('view').innerHTML=fallView();return}let e=a.pool.length?a.pool.pop():rand(fallPool());let gid=a.nextID++;let one={id:gid+'en',group:gid,lang:'en',value:e.en},two={id:gid+'fr',group:gid,lang:'fr',value:e.fr};let old=a.tiles;let i=Math.floor(Math.random()*(old.length+1));old.splice(i,0,one);let choices=Array.from({length:old.length+1},(_,j)=>j).filter(j=>Math.abs(j-i)>2);old.splice(rand(choices.length?choices:[old.length]),0,two);a.tiles=old;if(state.tab==='fall')$('view').innerHTML=fallView()}
function fall(){if(!active||active.mode!=='fall')startFall();return fallView()}

function fallPick(i){let a=active;if(!a||a.finished)return;let v=a.tiles[i];if(a.selected===null){a.selected=v.id;$('view').innerHTML=fallView();return}if(a.selected===v.id){a.selected=null;$('view').innerHTML=fallView();return}let first=a.tiles.find(t=>t.id===a.selected);a.selected=null;if(first.group===v.group&&first.lang!==v.lang){a.tiles=a.tiles.filter(t=>t.id!==first.id&&t.id!==v.id);a.score++;state.stats.correct++;state.stats.total++;persist();if(a.tiles.length===0){a.finished=true;a.result='Grille vidée !';clearInterval(fallTimer);state.best.fall=Math.max(state.best.fall||0,a.score);persist()}}else{a.mistakes++;toast('Ce n’est pas la bonne paire')}if(state.tab==='fall')$('view').innerHTML=fallView()}

function startLevel(n){if(n>state.unlocked){toast('Termine le niveau précédent');return}stopTimers();active={mode:'level',level:n,kind:LEVELTYPES[n-1],index:0,correct:0,wrong:0,total:n<=5?5:n<=10?6:n<=15?7:8,task:null,started:Date.now(),result:false,phase:'play',used:[]};state.tab='path';persist();renderLevel()}
function nextTask(){let l=active;let kind=l.kind;if(kind==='final')kind=['quiz','conj','fill','pairs','speed'][l.index%5];if(kind==='quiz'||kind==='speed'){let q=newChoice('level',Math.ceil(l.level/4));l.task={kind,entry:q.entry,reverse:q.reverse,correct:q.correct,options:q.options,picked:null,answered:false};}else if(kind==='conj'){let q=newConj('level',Math.ceil(l.level/4));l.task={kind, ...q};}else if(kind==='fill'){let q=rand(FILL.slice(0,Math.min(FILL.length,5+Math.ceil(l.level/2))));l.task={kind,q,done:false,input:''};}else if(kind==='pairs'||kind==='memory'){let q=sample(qBank(Math.ceil(l.level/4)),l.level>=12?5:4);l.task={kind,entries:q,tiles:shuffle(q.flatMap((e,i)=>[{id:i+'-en',group:i,lang:'en',value:e.en},{id:i+'-fr',group:i,lang:'fr',value:e.fr}])),selected:null,matched:[],up:[],done:false};} }
function renderLevel(){if(state.tab!=='path'||!active||active.mode!=='level')return;if(active.result){$('view').innerHTML=levelEndView();return}if(!active.task)nextTask();let l=active,task=l.task;let body='';if(task.kind==='quiz'||task.kind==='speed'){body=`<div class="qbox"><div class="muted">${task.reverse?'Français → anglais':'Anglais → français'}</div><div class="bigword">${escapeHTML(task.reverse?task.entry.fr:task.entry.en)}</div></div>${task.options.map((x,i)=>`<button class="opt ${task.answered?(x===task.correct?'correct':x===task.picked?'wrong':''):''}" ${task.answered?'disabled':''} onclick="levelChoice(${i})">${escapeHTML(x)}</button>`).join('')}${task.answered?levelFeedback(task):''}`}
else if(task.kind==='conj'||task.kind==='fill'){let prompt=task.kind==='conj'?task.prompt:task.q.s;body=`<div class="prompt"><div class="sentence">${escapeHTML(prompt)}</div>${task.kind==='conj'?`<div class="muted">${escapeHTML(task.v.fr)}</div>`:`<div class="muted">${escapeHTML(task.q.hint)}</div>`}</div>${task.done?`<div class="feedback ${normalize(task.input)===normalize(task.kind==='conj'?task.correct:task.q.a)?'good':'bad'}">${normalize(task.input)===normalize(task.kind==='conj'?task.correct:task.q.a)?'✅ Bravo':'La réponse : '+escapeHTML(task.kind==='conj'?task.correct:task.q.a)}</div>${btn('Continuer ➜','advanceLevel()','yellow')}`:`<input class="input" id="levelinput" placeholder="Écris le mot…" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')levelWrite()"><div class="buttons">${btn('Vérifier ✓','levelWrite()','yellow')}</div>`}`}
else if(task.kind==='pairs'||task.kind==='memory'){body=`<p class="muted">${task.kind==='memory'?'Retourne les cartes cachées':'Trouve les correspondances anglais / français'}</p><div class="progress-head"><strong>${task.matched.length/2} / ${task.entries.length} paires</strong></div><div class="pairgrid">${task.tiles.map((t,i)=>`<button class="${task.kind==='memory'?'flip '+(task.up.includes(t.id)?'face':''):'pair '+(task.selected===t.id?'active':'')} ${task.matched.includes(t.id)?task.kind==='memory'?'done':'matched':''}" onclick="levelPair(${i})">${task.kind==='memory'&&!task.up.includes(t.id)?'❔':escapeHTML(t.value)}</button>`).join('')}</div>${task.done?`<div class="feedback good">✅ Toutes les paires !</div>${btn('Continuer ➜','advanceLevel()','yellow')}`:''}`}
$('view').innerHTML=`<section class="card"><div class="tagline">Match ${l.level}/20 · ${escapeHTML(LEVELNAMES[l.level-1])}</div><h2>${l.level===20?'🏆 Finale':'🏐 Défi'} ${l.index+1}/${l.total}</h2><div class="progress-head"><span>✅ ${l.correct} bonne(s)</span><span>❌ ${l.wrong} erreur(s)</span></div><div class="meter"><div style="width:${Math.round(l.index/l.total*100)}%"></div></div>${body}<div class="buttons">${btn('← Retour au parcours',"exitLevel()",'pale')}</div></section>`}
function levelFeedback(t){return `<div class="feedback ${t.picked===t.correct?'good':'bad'}">${t.picked===t.correct?'✅ Bonne réponse !':'❌ Bonne réponse : '+escapeHTML(t.correct)}</div>${btn('Continuer ➜','advanceLevel()','yellow')}`}
function levelChoice(i){let t=active.task;if(t.answered)return;t.picked=t.options[i];t.answered=true;let ok=t.picked===t.correct;active[ok?'correct':'wrong']++;renderLevel()}
function levelWrite(){let t=active.task;if(t.done)return;let x=$('levelinput').value.trim();if(!x){toast('Écris une réponse');return}t.input=x;t.done=true;let ok=normalize(x)===normalize(t.kind==='conj'?t.correct:t.q.a);active[ok?'correct':'wrong']++;renderLevel()}
function levelPair(i){let t=active.task;if(lock||t.done)return;let x=t.tiles[i];if(t.matched.includes(x.id))return;if(t.kind==='pairs'){if(t.selected===null){t.selected=x.id;renderLevel();return}let first=t.tiles.find(z=>z.id===t.selected);t.selected=null;if(first.group===x.group&&first.lang!==x.lang)t.matched.push(first.id,x.id);else toast('Pas cette paire');if(t.matched.length===t.tiles.length){t.done=true;active.correct++}renderLevel();return}if(t.up.includes(x.id))return;t.up.push(x.id);renderLevel();if(t.up.length===2){let a=t.tiles.find(z=>z.id===t.up[0]),b=t.tiles.find(z=>z.id===t.up[1]);lock=true;setTimeout(()=>{if(a.group===b.group&&a.lang!==b.lang)t.matched.push(a.id,b.id);t.up=[];lock=false;if(t.matched.length===t.tiles.length){t.done=true;active.correct++}if(state.tab==='path'&&active?.task===t)renderLevel()},a.group===b.group?400:850)}}
function advanceLevel(){let l=active;l.index++;l.task=null;if(l.index>=l.total){let rate=l.correct/l.total;let passed=rate>=.6;let stars=rate>=.9?3:rate>=.75?2:passed?1:0;l.result={passed,rate,stars};if(passed){state.stars[String(l.level)]=Math.max(levelStars(l.level),stars);state.unlocked=Math.max(state.unlocked,Math.min(20,l.level+1))}state.stats.total+=l.total;state.stats.correct+=l.correct;persist();}renderLevel()}

function exitLevel(){stopTimers();active=null;$('view').innerHTML=path()}
function progress(){let known=Object.values(state.seen).filter(x=>x>=3).length,hard=ALL.filter(x=>state.hard[x.key]);let rate=state.stats.total?Math.round(state.stats.correct/state.stats.total*100):0;return `<section class="card"><h2>📈 Mes progrès</h2><div class="stats"><div><strong>${known}</strong><small>Maîtrisés</small></div><div><strong>${hard.length}</strong><small>À revoir</small></div><div><strong>${rate}%</strong><small>Réussite</small></div></div><div class="stats"><div><strong>${state.unlocked}/20</strong><small>Débloqués</small></div><div><strong>${state.best.speed||0}</strong><small>Record chrono</small></div><div><strong>${state.best.fall||0}</strong><small>Paires Tetris</small></div></div><h3>🔁 Les mots à revoir</h3>${hard.length?hard.slice(0,60).map(v=>`<div class="lesson"><div><strong>${escapeHTML(v.en)}</strong><small>${escapeHTML(v.fr)}</small></div>${audioBtn(v.en)}</div>`).join(''):'<p class="muted">Aucun pour le moment. Commence par « J’apprends » et indique les mots difficiles.</p>'}<div class="buttons">${btn('🧠 Réviser maintenant',"openTab('learn')",'yellow')}</div></section><section class="card"><h3>Sauvegarde</h3><p class="muted">Tes progrès sont enregistrés sur ce navigateur, sur cet appareil. Effacer les données de Safari peut les supprimer.</p>${btn('Remettre la progression à zéro','confirmReset()','red')}</section>`}
function confirmReset(){if(confirm('Effacer toute la progression de English avec Shany sur cet appareil ?')){stopTimers();localStorage.removeItem(KEY);state=JSON.parse(JSON.stringify(DEFAULT));active=null;openTab('home')}}
window.addEventListener('pagehide',()=>{persist()});
render();
